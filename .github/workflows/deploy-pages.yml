name: Deploy SplitSmart to GitHub Pages

on:
  push:
    branches: [feature/splitsmart-premium-ui]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read
  administration: write

jobs:
  allow-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Add this branch to the github-pages deployment policy
        continue-on-error: true
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies" \
            -d '{"name": "feature/splitsmart-premium-ui"}' && echo ""

  deploy:
    needs: allow-branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (enables Pages with Actions build type on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
